name: Verify GitHub API authorization
on:
  pull_request:
    paths:
      - 'src/lib/githubApiAuth.ts'
      - 'src/lib/githubApp.ts'
      - 'src/app/api/**'
      - 'tests/security-auth.test.mjs'
      - '.github/workflows/security-auth.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: node --experimental-strip-types --test tests/security-auth.test.mjs
      - run: npm run typecheck
      - run: npm run build
