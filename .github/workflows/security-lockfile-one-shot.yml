name: Security dependency lock (one-shot)
on:
  push:
    branches:
      - security/authorize-github-api-20261021
    paths:
      - '.github/workflows/security-lockfile-one-shot.yml'
permissions:
  contents: write
jobs:
  lock:
    if: github.repository == 'Josh-Temple/Plexus' && github.ref == 'refs/heads/security/authorize-github-api-20261021'
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Assert exact runtime versions
        run: |
          node - <<'NODE'
          const pkg = require('./package.json'), lock = require('./package-lock.json');
          for (const name of ['next','react','react-dom']) {
            const expected = pkg.dependencies[name];
            if (lock.packages[''].dependencies[name] !== expected || lock.packages['node_modules/'+name].version !== expected) throw Error(name + ' not pinned');
          }
          NODE
      - name: Commit lock only
        run: |
          git add package-lock.json
          if git diff --cached --quiet; then echo 'Unchanged'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build: lock security-patched dependency graph'
          git push origin HEAD:refs/heads/security/authorize-github-api-20261021
